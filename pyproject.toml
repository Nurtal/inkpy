[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkpy"
version = "0.1.0.dev0"
description = "Deterministic comic strip engine: declarative YAML + reusable assets in, PNG out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.0",
    # Text is measured and emitted as glyph outlines, never as <text>. Both
    # halves of that promise live in inkpy/styles/typeface.py and need this.
    "fonttools>=4.40",
    "typer>=0.12",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
# lxml parses the rendered SVG in the render tests. The engine writes SVG by
# hand and never reads it back, so it is not a runtime dependency.
dev = ["pytest>=8.0", "lxml>=5.0"]

[project.scripts]
inkpy = "inkpy.cli:main"

[tool.setuptools.packages.find]
include = ["inkpy*"]

[tool.setuptools.package-data]
"inkpy.styles" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
