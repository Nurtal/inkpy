[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkpy"
version = "0.1.0.dev0"
description = "Deterministic comic strip engine: declarative YAML + reusable assets in, PNG out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "lxml>=5.0",
    "typer>=0.12",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
inkpy = "inkpy.cli:app"

[tool.setuptools.packages.find]
include = ["inkpy*"]

[tool.setuptools.package-data]
"inkpy.styles" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
